# CodeRabbit review policy for the Rayopay fork.
# The GitHub App is already installed; repository YAML enables automatic reviews.
# Review non-draft PRs targeting the default branch, including incremental pushes.
# Leave other behavior at provider defaults, including its review auto-pause limit.
# Reviews do not grant merge/deployment approval or replace required CI.
reviews:
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches: []
